<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>決済完了｜ROUTE 受験Q&A</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{--blue:#267EE6;--deep:#174e90;--bg:#f4f8fd;--text:#172231;--sub:#637083;--ok:#0f8a5f}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.card{width:min(560px,100%);background:#fff;border:2px solid #d7e3f1;border-radius:24px;padding:30px 22px;text-align:center;box-shadow:0 14px 36px rgba(23,78,144,.08)}
    .mark{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e9f8f1;color:var(--ok);font-size:46px;font-weight:900}.mark.cancel{background:#fff0f0;color:#d92d20}
    h1{margin:0;font-size:30px;line-height:1.4;color:var(--deep)}p{margin:14px 0 0;color:var(--sub);font-size:17px;line-height:1.8}.note{margin-top:20px;padding:15px;border-radius:14px;background:#edf5ff;color:#244b75;font-weight:700;line-height:1.7}
    .btn{display:block;width:100%;margin-top:24px;padding:18px 16px;border-radius:15px;background:var(--blue);color:#fff;text-decoration:none;font-size:20px;font-weight:900;border:0;cursor:pointer}.subbtn{display:block;margin-top:12px;color:var(--blue);font-weight:800;text-decoration:underline;text-underline-offset:3px}
  </style>
</head>
<body>
  <div class="wrap"><main class="card">
    <div class="mark" id="mark">✓</div>
    <h1 id="title">決済が完了しました</h1>
    <p id="text">お支払いありがとうございます。決済情報を確認後、購入された質問回数が反映されます。</p>
    <div class="note" id="note">この画面ではLINEを自動起動しません。<br>下のボタンからQ&Aへ戻ってください。</div>
    <a class="btn" id="backBtn" href="https://jukensoudan-route.github.io/route-qa/">LINEでQ&Aに戻る</a>
    <a class="subbtn" href="https://jukensoudan-route.github.io/">ROUTE公式HPへ戻る</a>
  </main></div>
  <script>
    (function(){
      var p=new URLSearchParams(location.search);
      var state=p.get('stripe');
      if(state==='cancel'){
        document.getElementById('mark').textContent='!';
        document.getElementById('mark').classList.add('cancel');
        document.getElementById('title').textContent='決済をキャンセルしました';
        document.getElementById('text').textContent='質問回数は追加されていません。必要な場合はQ&Aページからもう一度お手続きください。';
        document.getElementById('note').innerHTML='この画面ではLINEを自動起動しません。<br>下のボタンからQ&Aへ戻ってください。';
      }
    })();
  </script>
</body>
</html>
